name: Docs

on:
  push:
    branches: [main]
  pull_request:

# This workflow only checks relative Markdown links. It never needs write access
# to the repository, so the GITHUB_TOKEN is limited to read-only contents.
permissions:
  contents: read

jobs:
  check-doc-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check relative Markdown links
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .github/scripts/check-doc-links.ps1
